<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>FastSim · SECS/GEM 模拟与测试平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f141b'/%3E%3Cpath d='M18 5 9 18h6l-1 9 9-13h-6l1-9Z' fill='%234ee0c1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <a class="side-brand" href="#/overview" aria-label="FastSim 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="url(#bg)"/><path d="M18.4 4.5 8.6 18.2h5.9l-1.2 9.3 9.9-13.8h-5.9l1.1-9.2Z" fill="#4ee0c1"/><defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#1a2430"/><stop offset="1" stop-color="#0b1016"/></linearGradient></defs></svg>
      </span>
      <span class="brand-text">
        <strong>FastSim</strong>
        <small>SECS/GEM 联调工具</small>
      </span>
    </a>

    <nav class="side-nav" aria-label="主导航">
      <div class="nav-label">工作区</div>
      <a class="nav-item" href="#/overview" data-route="overview">
        <span class="nav-icon" data-icon="grid"></span><span class="nav-text">开始使用</span>
      </a>
      <a class="nav-item" href="#/sessions" data-route="sessions">
        <span class="nav-icon" data-icon="terminal"></span><span class="nav-text">联调工作台</span>
        <span class="nav-badge" id="nav-session-count"></span>
      </a>
      <a class="nav-item" href="#/scenarios" data-route="scenarios">
        <span class="nav-icon" data-icon="play"></span><span class="nav-text">场景中心</span>
      </a>
      <div class="nav-label">配置</div>
      <a class="nav-item" href="#/profiles" data-route="profiles">
        <span class="nav-icon" data-icon="sliders"></span><span class="nav-text">机台配置</span>
      </a>
      <a class="nav-item" href="#/docs" data-route="docs">
        <span class="nav-icon" data-icon="book"></span><span class="nav-text">使用指南</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="health" id="side-health">
        <span class="dot idle" id="health-dot"></span>
        <span class="health-text">
          <b id="health-label">正在连接</b>
          <small id="health-meta">API · /api/v1</small>
        </span>
      </div>
      <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <span data-icon="moon"></span>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开导航">
        <span data-icon="menu"></span>
      </button>
      <div class="crumb">
        <span id="page-title">开始使用</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span id="page-section" class="crumb-sub">创建会话并完成第一次联调</span>
      </div>
      <div class="topbar-actions">
        <span class="live-badge" id="live-badge"><span class="dot idle"></span><span>连接中</span></span>
        <button class="icon-btn" id="btn-refresh" title="刷新数据" aria-label="刷新数据">
          <span data-icon="refresh"></span>
        </button>
        <button class="btn primary" id="btn-new-session">
          <span data-icon="plus"></span><span>新建联调</span>
        </button>
      </div>
    </header>

    <main class="page" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
